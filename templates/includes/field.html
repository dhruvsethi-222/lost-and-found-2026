{# One form field: label, input, help text and the message area (filled by Django or by forms.js). #}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label">
    {{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  <p id="{{ field.html_name }}-message" class="field-message" aria-live="polite">{{ field.errors|join:" " }}</p>
</div>
