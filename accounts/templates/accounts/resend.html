{% extends 'base.html' %}
{% block title %}Send the link again{% endblock %}
{% block content %}
<section class="narrow">
  <h1 class="h3 mb-3">Send the verification link again</h1>
  <form method="post" data-validate>
    {% csrf_token %}
    {% for field in form %}{% include 'includes/field.html' %}{% endfor %}
    <button type="submit" class="btn btn-success w-100">Send the link</button>
  </form>
</section>
{% endblock %}
